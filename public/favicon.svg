<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Vlookar: le due ruote del logo (vroomy-backend/docs/logo). Colori della grafica "cruscotto";
       il favicon segue il tema del browser, non il pulsante del sito. -->
  <style>
    .bg { fill: #16191c; }
    .w { fill: none; stroke: #f3f2ee; }
    .sig { fill: #e09400; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e6e4df; }
      .w { stroke: #111315; }
      .sig { fill: #f5a300; }
    }
  </style>
  <defs>
    <g id="ruota">
      <circle class="w" r="17.4" stroke-width="6.2"/>
      <circle class="w" r="12.6" stroke-width="1.8"/>
      <circle class="w" r="10.6" stroke-width="1.6"/>
      <g class="w" stroke-width="1.9" stroke-linecap="round">
        <line y1="-3.6" y2="-10.6"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(36)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(72)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(108)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(144)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(180)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(216)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(252)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(288)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(324)"/>
      </g>
      <circle class="sig" r="3.2"/>
    </g>
  </defs>
  <rect class="bg" width="64" height="64" rx="4"/>
  <use href="#ruota" transform="translate(17.5,32) scale(0.66)"/>
  <use href="#ruota" transform="translate(46.5,32) scale(0.66) rotate(18)"/>
</svg>
