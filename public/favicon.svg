<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Vlookar: solo le due ruote del logo, senza fondo. Nere col tema chiaro del browser,
       bianche con quello scuro; il mozzo resta ambra. Non segue il pulsante del sito. -->
  <style>
    .w { fill: none; stroke: #16191c; }
    .sig { fill: #e09400; }
    @media (prefers-color-scheme: dark) {
      .w { stroke: #ffffff; }
      .sig { fill: #f5a300; }
    }
  </style>
  <defs>
    <g id="ruota">
      <circle class="w" r="17.4" stroke-width="6.2"/>
      <circle class="w" r="12.6" stroke-width="1.8"/>
      <circle class="w" r="10.6" stroke-width="1.6"/>
      <g class="w" stroke-width="1.9" stroke-linecap="round">
        <line y1="-3.6" y2="-10.6"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(36)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(72)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(108)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(144)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(180)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(216)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(252)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(288)"/>
        <line y1="-3.6" y2="-10.6" transform="rotate(324)"/>
      </g>
      <circle class="sig" r="3.2"/>
    </g>
  </defs>
  <use href="#ruota" transform="translate(16,32) scale(0.76)"/>
  <use href="#ruota" transform="translate(48,32) scale(0.76) rotate(18)"/>
</svg>
